<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8 px rule: 8 / 16 / 24 / 32 / 40 / 64 / 80 / 120." viewport="700x340" -->
<html><head>
<meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:340px;">
  <span class="label">8 px rule spacing</span>
  <div style="display:flex; flex-direction:column; gap:10px;">
    <!-- token rows -->
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">8</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">0.5rem</span><div style="height:8px; width:8px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">16</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">1rem</span><div style="height:8px; width:16px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">24</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">1.5rem</span><div style="height:8px; width:24px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">32</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">2rem</span><div style="height:8px; width:32px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">40</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">2.5rem</span><div style="height:8px; width:40px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">64</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">4rem</span><div style="height:8px; width:64px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">80</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">5rem</span><div style="height:8px; width:80px; background:#FF4D4F; border-radius:2px;"></div></div>
    <div style="display:flex; align-items:center; gap:16px;"><span class="mono" style="width:48px;">120</span><span style="font-family:var(--font-body); font-size:13px; width:64px;">7.5rem</span><div style="height:8px; width:120px; background:#FF4D4F; border-radius:2px;"></div></div>
  </div>
</div>
</body></html>
