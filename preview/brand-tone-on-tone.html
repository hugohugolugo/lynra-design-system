<!doctype html>
<!-- @dsCard group="Brand" name="Tone-on-tone tiles" subtitle="Giant Funnel Display word filling a tile — Gym / Spa / Market." viewport="700x280" -->
<html><head>
<meta charset="utf-8"><title>Tone-on-tone</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:280px;">
  <span class="label">Tone-on-tone · giant display words filling a tile</span>
  <div class="row" style="gap:10px;">
    <div style="flex:1; background:#FF4D4F; border-radius:10px; height:200px; overflow:hidden; position:relative;">
      <span style="position:absolute; left:18px; top:-14px; font-family:var(--font-display); font-weight:500; font-size:180px; line-height:1.1; letter-spacing:-0.03em; color:#4D0B00;">Gym</span>
    </div>
    <div style="flex:1; background:#ABA69B; border-radius:10px; height:200px; overflow:hidden; position:relative;">
      <span style="position:absolute; left:18px; top:-14px; font-family:var(--font-display); font-weight:500; font-size:180px; line-height:1.1; letter-spacing:-0.03em; color:#3E3B34;">Spa</span>
    </div>
    <div style="flex:1; background:#242428; border-radius:10px; height:200px; overflow:hidden; position:relative;">
      <span style="position:absolute; left:14px; top:-14px; font-family:var(--font-display); font-weight:500; font-size:140px; line-height:1.1; letter-spacing:-0.03em; color:#3E3B34;">Market</span>
    </div>
  </div>
  <span class="mono">One word per tile. Letterforms bleed past the edge. Pair only with grayscale.</span>
</div>
</body></html>
