<!doctype html>
<!-- @dsCard group="Colors" name="Color pairings" subtitle="Three sanctioned combos: Umber + Ember, Obsidian + Ash, Clay + imagery." viewport="700x260" -->
<html><head>
<meta charset="utf-8"><title>Color pairings</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:260px; gap:14px;">
  <span class="label">Sanctioned pairings · max 2 colors per surface</span>
  <div class="row" style="gap:10px;">
    <div style="flex:1; background:#4D0B00; border-radius:10px; padding:18px 20px; height:170px; display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-family:var(--font-display); font-weight:600; font-size:38px; line-height:0.95; letter-spacing:-0.03em; color:#FF4D4F;">A world<br>beyond<br>function</span>
      <span class="label" style="color:#FF4D4F; opacity:0.75;">Umber + Ember · visionary</span>
    </div>
    <div style="flex:1; background:#242428; border-radius:10px; padding:18px 20px; height:170px; display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-family:var(--font-display); font-weight:500; font-size:38px; line-height:0.95; letter-spacing:-0.03em; color:#F6F4F4;">Quiet,<br>steady,<br>scalable</span>
      <span class="label" style="color:#999999;">Obsidian + Ash · default</span>
    </div>
    <div style="flex:1; background:#ABA69B; border-radius:10px; padding:18px 20px; height:170px; display:flex; flex-direction:column; justify-content:space-between;">
      <span style="font-family:var(--font-display); font-weight:500; font-size:38px; line-height:0.95; letter-spacing:-0.03em; color:#242428;">Photos<br>pop on<br>Clay</span>
      <span class="label" style="color:#3E3B34; opacity:0.7;">Clay + imagery</span>
    </div>
  </div>
</div>
</body></html>
