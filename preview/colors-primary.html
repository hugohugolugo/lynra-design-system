<!doctype html>

<html><head>
<meta charset="utf-8"><title>Primary colors</title>
<link rel="stylesheet" href="_card.css">
</head><body>

        <span style="font-family:var(--font-body); font-weight:500; font-size:11px; opacity:0.7;">240 / 80 / 82 · Pantone 1785</span>
      </div>
    </div>
    <div style="flex:1; background:#4D0B00; border-radius:10px; padding:20px; min-height:140px; display:flex; flex-direction:column; justify-content:space-between; color:#FF4D4F;">
      <span style="font-family:var(--font-display); font-weight:500; font-size:28px; letter-spacing:-0.025em; line-height:1;">Umber</span>
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-family:var(--font-body); font-weight:600; font-size:13px;">#4D0B00</span>
        <span style="font-family:var(--font-body); font-weight:500; font-size:11px; opacity:0.7;">73 / 21 / 14 · Pantone 3523</span>
