<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Four-step shadow scale, opaque-first. Restrained — no glow." viewport="700x230" -->
<html><head>
<meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:230px;">
  <span class="label">Elevation · restrained, opaque, no glow</span>
  <div class="row" style="gap:16px; padding:12px 0 8px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="width:120px; height:80px; background:#FFFFFF; border-radius:10px;"></div>
      <div style="display:flex; flex-direction:column; align-items:center;"><span style="font-family:var(--font-body); font-weight:600; font-size:13px;">Flat</span><span class="mono">--shadow-none</span></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="width:120px; height:80px; background:#FFFFFF; border-radius:10px; box-shadow:0 1px 2px rgba(36,36,40,0.04),0 1px 1px rgba(36,36,40,0.03);"></div>
      <div style="display:flex; flex-direction:column; align-items:center;"><span style="font-family:var(--font-body); font-weight:600; font-size:13px;">Raised</span><span class="mono">--shadow-1</span></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="width:120px; height:80px; background:#FFFFFF; border-radius:10px; box-shadow:0 4px 16px rgba(36,36,40,0.06),0 1px 2px rgba(36,36,40,0.04);"></div>
      <div style="display:flex; flex-direction:column; align-items:center;"><span style="font-family:var(--font-body); font-weight:600; font-size:13px;">Floating</span><span class="mono">--shadow-2</span></div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="width:120px; height:80px; background:#FFFFFF; border-radius:10px; box-shadow:0 12px 32px rgba(36,36,40,0.10),0 2px 4px rgba(36,36,40,0.04);"></div>
      <div style="display:flex; flex-direction:column; align-items:center;"><span style="font-family:var(--font-body); font-weight:600; font-size:13px;">Modal</span><span class="mono">--shadow-3</span></div>
    </div>
  </div>
</div>
</body></html>
