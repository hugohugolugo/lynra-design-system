<!doctype html>
<!-- @dsCard group="Brand" name="Dot grid motif" subtitle="Three variants: decorative (24×), densed (wayfinding), oversized on Clay." viewport="700x280" -->
<html><head>
<meta charset="utf-8"><title>Dot grid</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:280px;">
  <span class="label">Dot grid · decorative motif · 24× the dot size</span>
  <div class="row" style="gap:10px;">
    <div style="flex:1; background:#FFFFFF; border:1px solid #E8E4E0; border-radius:10px; height:200px; position:relative; overflow:hidden;">
      <div style="position:absolute; inset:0; background-image:radial-gradient(circle, rgba(36,36,40,0.22) 2px, transparent 2.5px); background-size:24px 24px;"></div>
      <span class="mono" style="position:absolute; left:14px; bottom:10px;">Decorative · 24×</span>
    </div>
    <div style="flex:1; background:#242428; border-radius:10px; height:200px; position:relative; overflow:hidden;">
      <div style="position:absolute; inset:0; background-image:radial-gradient(circle, rgba(246,244,244,0.18) 2px, transparent 2.5px); background-size:8px 8px;"></div>
      <span class="mono" style="position:absolute; left:14px; bottom:10px; color:#999999;">Densed · 2× · wayfinding</span>
    </div>
    <div style="flex:1; background:#ABA69B; border-radius:10px; height:200px; position:relative; overflow:hidden;">
      <div style="position:absolute; inset:0; background-image:radial-gradient(circle, rgba(36,36,40,0.25) 2.5px, transparent 3px); background-size:32px 32px;"></div>
      <span class="mono" style="position:absolute; left:14px; bottom:10px; color:#3E3B34;">On Clay · oversized</span>
    </div>
  </div>
</div>
</body></html>
