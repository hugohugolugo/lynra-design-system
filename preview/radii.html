<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="Always rounded. Default card radius is 10px. Peg-tile uses asymmetric 64/40/40/40." viewport="700x220" -->
<html><head>
<meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:220px;">
  <span class="label">Corner radii · always rounded, never sharp</span>
  <div class="row" style="gap:10px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:80px; background:#FFFFFF; border:1px solid #E8E4E0; border-radius:6px;"></div><span class="mono">6 · xs</span></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:80px; background:#FFFFFF; border:1px solid #E8E4E0; border-radius:10px;"></div><span class="mono">10 · md ✦</span></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:80px; background:#FFFFFF; border:1px solid #E8E4E0; border-radius:16px;"></div><span class="mono">16 · lg</span></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:80px; background:#FFFFFF; border:1px solid #E8E4E0; border-radius:24px;"></div><span class="mono">24 · xl</span></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:80px; background:#D6D0CC; border-radius:64px 40px 40px 40px;"></div><span class="mono">peg-tile</span></div>
    <div style="display:flex; flex-direction:column; gap:6px; align-items:center;"><div style="width:80px; height:32px; background:#242428; border-radius:999px;"></div><span class="mono">pill</span></div>
  </div>
  <span class="mono" style="margin-top:4px;">✦ default card radius from brandbook</span>
</div>
</body></html>
