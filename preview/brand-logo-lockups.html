<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockups" subtitle="Horizontal, vertical, symbol, wordmark. Sourced from supplied SVGs." viewport="700x260" -->
<html><head>
<meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:260px;">
  <span class="label">Logo lockups</span>
  <div class="row" style="gap:12px; align-items:stretch;">
    <div style="flex:1.4; background:#FFFFFF; border-radius:10px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:170px;">
      <img src="../assets/logos/lynra-logo-horizontal-obsidian.svg" alt="" style="height:36px; align-self:flex-start;">
      <span class="mono">Horizontal lockup</span>
    </div>
    <div style="flex:1; background:#FFFFFF; border-radius:10px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; min-height:170px;">
      <img src="../assets/logos/lynra-logo-vertical-obsidian.svg" alt="" style="height:80px;">
      <span class="mono" style="align-self:flex-start;">Vertical lockup</span>
    </div>
    <div style="flex:0.7; background:#FFFFFF; border-radius:10px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; align-items:center; min-height:170px;">
      <img src="../assets/logos/lynra-symbol-obsidian.svg" alt="" style="height:64px;">
      <span class="mono" style="align-self:flex-start;">Symbol</span>
    </div>
    <div style="flex:1; background:#FFFFFF; border-radius:10px; padding:24px; display:flex; flex-direction:column; justify-content:space-between; min-height:170px;">
      <img src="../assets/logos/lynra-wordmark-obsidian.svg" alt="" style="height:32px; align-self:flex-start;">
      <span class="mono">Wordmark</span>
    </div>
  </div>
</div>
</body></html>
