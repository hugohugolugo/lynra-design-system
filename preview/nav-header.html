<!doctype html>
<!-- @dsCard group="Components" name="Site header" subtitle="Meta strip + logo / nav / CTA — the marketing site header pattern." viewport="700x180" -->
<html><head>
<meta charset="utf-8"><title>Header bar</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="card card-flush" style="background:#F6F4F4; height:180px;">
  <!-- Pres header replica -->
  <div style="width:100%; height:52px; background:#F6F4F4; border-bottom:1px solid #E8E4E0; padding:0 32px; display:flex; align-items:center; gap:24px; font-family:var(--font-body); font-weight:500; font-size:12px; letter-spacing:0.04em; text-transform:uppercase; color:#242428;">
    <span style="opacity:0.55;">Brand ID</span>
    <span>Lynra</span>
    <span style="opacity:0.55;">2025</span>
    <span style="opacity:0.55;">Confidential</span>
    <span style="margin:0 16px; height:14px; width:1px; background:#D6D0CC;"></span>
    <span>Colors</span>
    <span style="opacity:0.55;">Visual identity</span>
  </div>
  <!-- Logo lockup row -->
  <div style="padding:20px 32px; display:flex; align-items:center; justify-content:space-between;">
    <img src="../assets/logos/lynra-logo-horizontal-obsidian.svg" alt="Lynra" style="height:36px;">
    <div style="display:flex; gap:24px; font-family:var(--font-body); font-weight:500; font-size:14px; color:#242428;">
      <span>Villages</span><span>System</span><span>About</span><span style="color:#999999;">Press</span>
    </div>
    <button style="background:#242428; color:#F6F4F4; border:0; border-radius:999px; padding:10px 18px; font-family:var(--font-body); font-weight:500; font-size:13px; display:inline-flex; align-items:center; gap:6px;">Book a viewing →</button>
  </div>
  <div style="padding:0 32px 16px;"><span class="mono">Site header pattern: meta strip 52px + logo / nav / CTA row.</span></div>
</div>
</body></html>
