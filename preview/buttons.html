<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Pill buttons. Obsidian primary, Ember confirm, ghost, icon-only, with-icon, disabled." viewport="700x280" -->
<html><head>
<meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
</head><body>
<div class="card" style="background:#F6F4F4; height:280px;">
  <span class="label">Buttons · sentence case, → glyph for forward action</span>
  <div class="row" style="gap:12px; align-items:center;">
    <button style="background:#242428; color:#F6F4F4; border:0; border-radius:999px; padding:14px 22px; font-family:var(--font-body); font-weight:500; font-size:15px; display:inline-flex; align-items:center; gap:8px; cursor:pointer;">Book a viewing <span style="font-family:var(--font-display); font-weight:500;">→</span></button>
    <button style="background:#FF4D4F; color:#4D0B00; border:0; border-radius:999px; padding:14px 22px; font-family:var(--font-body); font-weight:600; font-size:15px; cursor:pointer;">Confirm check-in</button>
    <button style="background:transparent; color:#242428; border:1px solid #242428; border-radius:999px; padding:13px 21px; font-family:var(--font-body); font-weight:500; font-size:15px; cursor:pointer;">Learn more</button>
  </div>
  <div class="row" style="gap:12px; align-items:center;">
    <button style="background:transparent; color:#242428; border:0; padding:8px 4px; font-family:var(--font-body); font-weight:500; font-size:15px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;">View dashboard <span style="font-family:var(--font-display); font-weight:500;">→</span></button>
    <button style="background:#FFFFFF; color:#242428; border:1px solid #D6D0CC; border-radius:999px; padding:13px 18px; font-family:var(--font-body); font-weight:500; font-size:14px; display:inline-flex; align-items:center; gap:8px; cursor:pointer;"><i class="ph-light ph-spray-bottle" style="font-size:18px"></i> Request cleaning</button>
    <button aria-label="Menu" style="background:#FFFFFF; color:#242428; border:1px solid #D6D0CC; border-radius:999px; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer;"><i class="ph-light ph-list" style="font-size:20px"></i></button>
  </div>
  <div class="row" style="gap:12px; align-items:center;">
    <button disabled style="background:#242428; color:#F6F4F4; border:0; border-radius:999px; padding:14px 22px; font-family:var(--font-body); font-weight:500; font-size:15px; opacity:0.4;">Disabled</button>
    <span class="mono">Hover → darker tone (Ash→Aluminium, Ember→Umber). Press → 96% scale, 100ms.</span>
  </div>
</div>
</body></html>
