<!-- SendoutCover: Sendout cover: a photograph at 80% over Aluminium with the 110px title in white at the margin, ending 80px above the foot, the meta strip on top. — @dsCard group="Sendout" page width=1280 height=720 subtitle="Sendout cover: a photograph at 80% over Aluminium with the 110px title in white at the margin, ending 80px above the foot, the meta strip on top." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<title>SendoutCover</title>
<style>
  html, body { margin: 0; background: #0e0e10; }
  .stage { width: 1280px; height: 720px; overflow: hidden; position: relative; }
  .slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
           background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 500;
           transform: scale(.6666667); transform-origin: 0 0; }
  .slide * { box-sizing: border-box; }
  .abs { position: absolute; }
  .meta { position: absolute; top: 0; left: 0; width: 1920px; height: 52px; font-size: 15px; line-height: 1.3; letter-spacing: -.01em; color: var(--fg); }
  .meta span { position: absolute; top: 24px; white-space: nowrap; }
  .title { position: absolute; margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 90px; line-height: .98; letter-spacing: -.04em; color: var(--fg); white-space: nowrap; }
  .statement { position: absolute; margin: 0; font-size: 36px; line-height: 1.4; }
  .head24 { font-weight: 600; font-size: 24px; line-height: 1.3; letter-spacing: -.01em; }
  .body16 { font-size: 16px; line-height: 1.35; }
  .peg { position: absolute; border-radius: 50%; }
  .tile { position: absolute; border-radius: var(--radius-md); }
  .caption { position: absolute; width: 216px; font-size: 16px; line-height: 1.35; }
  .caption .m { color: var(--fg-muted); }
  p { margin: 0; }
  /* slide text takes its container's colour; bundle.css's element defaults would otherwise paint every p and heading in fg */
  .slide p, .slide h1, .slide h2, .slide h3, .slide h4, .slide h5, .slide h6, .slide blockquote, .slide span { color: inherit; }
  .slide .title { color: var(--fg); }
  .send { background: var(--lynra-aluminium); }
  .h110 { position: absolute; margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 110px; line-height: .98; letter-spacing: -.04em; color: var(--fg); white-space: nowrap; }
  .copy { position: absolute; font-size: 21px; line-height: 1.35; color: var(--fg); }
  .copy p { margin: 0 0 21px; }
  .copy p:last-child { margin-bottom: 0; }
  .copy ol { margin: 0; padding: 0; list-style: none; counter-reset: item; }
  .copy li { margin: 0 0 16px; padding-left: 48px; position: relative; counter-increment: item; }
  .copy li::before { content: counter(item) "."; position: absolute; left: 0; }
</style>
</head>
<body>
<div class="stage"><div class="slide">
<div class="slide-bg abs" style="left:0;top:0;width:1920px;height:1080px;background:var(--lynra-aluminium)"></div>
<div class="photo abs" style="left:0;top:0;width:1920px;height:1080px;background:url(../assets/imagery/atmosphere-02.png) center / cover no-repeat;opacity:.8"></div>
<div class="meta"><span style="left:80px">Digital touchpoints</span><span style="left:979px">Partner name</span><span style="left:1450px">Lynra</span><span style="left:1606px">24 Feb 2026</span><span style="left:1763px">Confidential</span></div>
<h1 class="h110" style="left:80px;bottom:80px;color:var(--lynra-white)">Digital touchpoints</h1>
</div></div>
</body>
</html>
