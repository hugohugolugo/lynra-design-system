<!-- KeynoteStatement: The keynote's core slide: a photograph, a 26px label (Vision:) and one 90px white line on column 4, ending 160px above the foot. — @dsCard group="Keynote" page width=1280 height=720 subtitle="The keynote's core slide: a photograph, a 26px label (Vision:) and one 90px white line on column 4, ending 160px above the foot." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<title>KeynoteStatement</title>
<style>
  html, body { margin: 0; background: #0e0e10; }
  .stage { width: 1280px; height: 720px; overflow: hidden; position: relative; }
  .slide { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
           background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 500;
           transform: scale(.6666667); transform-origin: 0 0; }
  .slide * { box-sizing: border-box; }
  .abs { position: absolute; }
  .meta { position: absolute; top: 0; left: 0; width: 1920px; height: 52px; font-size: 15px; line-height: 1.3; letter-spacing: -.01em; color: var(--fg); }
  .meta span { position: absolute; top: 24px; white-space: nowrap; }
  .title { position: absolute; margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 90px; line-height: .98; letter-spacing: -.04em; color: var(--fg); white-space: nowrap; }
  .statement { position: absolute; margin: 0; font-size: 36px; line-height: 1.4; }
  .head24 { font-weight: 600; font-size: 24px; line-height: 1.3; letter-spacing: -.01em; }
  .body16 { font-size: 16px; line-height: 1.35; }
  .peg { position: absolute; border-radius: 50%; }
  .tile { position: absolute; border-radius: var(--radius-md); }
  .caption { position: absolute; width: 216px; font-size: 16px; line-height: 1.35; }
  .caption .m { color: var(--fg-muted); }
  p { margin: 0; }
  /* slide text takes its container's colour; bundle.css's element defaults would otherwise paint every p and heading in fg */
  .slide p, .slide h1, .slide h2, .slide h3, .slide h4, .slide h5, .slide h6, .slide blockquote, .slide span { color: inherit; }
  .slide .title { color: var(--fg); }
  .photo { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-size: cover; background-position: center; }
  .scrim { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: linear-gradient(180deg, rgba(36,36,40,0) 45%, rgba(36,36,40,.4) 100%); }
  .label { font-size: 26px; line-height: 1.2; font-weight: 500; letter-spacing: -.01em; margin: 0 0 24px; }
  .line { font-family: var(--font-display); font-weight: 500; font-size: 90px; line-height: .98; letter-spacing: -.04em; margin: 0; }
  .block { position: absolute; bottom: 160px; }
  .white, .slide .white, .slide .white * { color: var(--lynra-white); }
  .dots { background-image: radial-gradient(circle at center, var(--dot-color) var(--dot-size), transparent calc(var(--dot-size) + .5px)); background-size: var(--dot-spacing) var(--dot-spacing); }
  .card { position: absolute; border-radius: var(--radius-md); padding: 24px; }
  .card h4 { margin: 0 0 8px; font-family: var(--font-body); font-weight: 600; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
  .card p { margin: 0; font-size: 21px; line-height: 1.35; }
  .mark { position: absolute; left: 80px; top: 936px; width: 48px; height: 64px; }
</style>
</head>
<body>
<div class="stage"><div class="slide">
<div class="photo" style="background-image:url(../assets/imagery/jacket-view.jpg)"></div><div class="scrim"></div>
<div class="block white" style="left:530px;width:1160px"><p class="label">Vision:</p><p class="line">‘a world beyond function for<br>the workforce of tomorrow’</p></div>
</div></div>
</body>
</html>
